<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page {
            width: 900px;
            padding: 50px;
            border: 1px solid #eee;
            background: white;
        }

        .payment-box {
            background: #f7f6ef;
            padding: 60px 80px;
            text-align: center;
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: #4caf50;
            border-radius: 50%;
            margin: 0 auto 25px;
            color: white;
            font-size: 50px;
            line-height: 90px;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            color: #555;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .payment-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 80px;
            text-align: left;
            max-width: 500px;
            margin: 0 auto 40px;
            color: #666;
            font-size: 16px;
        }

        .payment-details strong {
            color: #444;
        }

        .amount {
            margin-top: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        button {
            width: 140px;
            padding: 12px;
            border: none;
            background: #ddd;
            color: #444;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #cfcfcf;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="payment-box">
            <div class="success-icon">✓</div>
            <h1>Payment successful</h1>

            <div class="payment-details">
                <div>Payment type</div>
                <div>Bank</div>

                <div>Mobile</div>
                <div>******</div>

                <div>Email</div>
                <div>Fia.Stolian@hotmail.com</div>

                <div class="amount">Amount paid</div>
                <div class="amount">899,- NOK</div>

                <div>Transaction Id</div>
                <div>******</div>
            </div>

            <div class="buttons">
                <button onclick="window.print()">Print</button>
                <button onclick="window.close()">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
